# jsk_travis
on:
  push:
    branches:
      - master
  pull_request:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  check_python2:
    runs-on: ubuntu-latest
    name: check_python2

    container: ubuntu:20.04

    steps:
      - name: Chcekout
        uses: actions/checkout@v4
      - name: Check Python2
        run: |
          apt update -q && apt install -y -q python2
          python2 -m compileall .

  check_python3:
    runs-on: ubuntu-latest
    name: check_python3

    container: ubuntu:20.04

    steps:
      - name: Install latest git to download .git directory in actions/checkout@v2, git diff requries .git directory ( use sudo for ros-ubuntu )
        run: apt-get update && apt-get install -y software-properties-common && apt-get update && add-apt-repository -y ppa:git-core/ppa && apt-get update && apt-get install -y git
      - name: work around permission issue  # https://github.com/actions/checkout/issues/760#issuecomment-1097501613
        run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Chcekout
        uses: actions/checkout@v4
      - name: Check Python3
        run: |
          apt update -q && apt install -y -q python3 git 2to3
          bash -c "ret=0; trap 'ret=1' ERR; python3 -m compileall .; 2to3 -w -f except -f execfile -f has_key -f raw_input -f zip .; find . -type f -exec grep -Iq . {} \; -a -not -regex '.*/node_scripts/[^/]*py' -exec 2to3 -w -f import {} \; ; git diff --exit-code . > /dev/null; echo Exitting with \$ret; exit \$ret"

  ros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ROS_DISTRO: indigo
            CONTAINER: jskrobotics/ros-ubuntu:14.04
            # latest catkin_virtualenv with pip==21.0.1 is incompatible with python 2.x
            # https://github.com/jsk-ros-pkg/jsk_3rdparty/pull/237
            BEFORE_SCRIPT : "sudo pip install virtualenv==15.1.0"
            # rosdep can't resolve ros_environment (needed for the ROS1/ROS2
            # dual-support CMakeLists/package.xml) on this EOL distro
            ALLOW_FAILURE: true
          - ROS_DISTRO: kinetic
            CONTAINER: ubuntu:16.04
          - ROS_DISTRO: melodic
            CONTAINER: ubuntu:18.04
          - ROS_DISTRO: noetic
            CONTAINER: ubuntu:20.04

    # use pip installed image due to https://github.com/jsk-ros-pkg/jsk_3rdparty/pull/237 : (Note that pip==21.0.1 is incompatible with python 2.x)
    container: ${{ matrix.CONTAINER }}
    continue-on-error: ${{ matrix.ALLOW_FAILURE == true }}

    steps:
      - name: Install git
        shell: bash
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          if [ "${{ matrix.CONTAINER }}" != "jskrobotics/ros-ubuntu:14.04" ]; then
            apt-get update
            apt-get install -y -qq sudo
          fi
          sudo apt-get update
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends git ca-certificates

      - name: work around permission issue  # https://github.com/actions/checkout/issues/760#issuecomment-1097501613
        run: |
          set -x
          export USER=$(whoami)
          if [ "${{ matrix.CONTAINER }}" = "jskrobotics/ros-ubuntu:14.04" ]; then
             git config --global --add safe.directory $GITHUB_WORKSPACE || echo "OK" # Show 'could not lock config file /github/home/.gitconfig: Permission denied', but it is ok
             sudo mkdir -p /__w/
             sudo chmod 777 -R /__w/
             sudo chown -R $USER $HOME
             # sudo mkdir -p /home/runner/work/_temp/_github_workflow/
             # sudo chown -R $USER $HOME /home/runner/work/_temp/_github_workflow/
             # ls -al /home/runner/work/_temp/_github_workflow/
          else
             git config --global --add safe.directory $GITHUB_WORKSPACE
          fi

      - name: Checkout repository without Node.js
        shell: bash
        run: |
          set -eux
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Run jsk_travis
        uses: jsk-ros-pkg/jsk_travis@master
        with:
          ROS_DISTRO : ${{ matrix.ROS_DISTRO }}
          BEFORE_SCRIPT : ${{ matrix.BEFORE_SCRIPT }}
          ROS_PARALLEL_TEST_JOBS: "-j8"

  debian-unstable:
    runs-on: ubuntu-latest
    container: debian:unstable

    steps:
      - name: Chcekout
        uses: actions/checkout@v4

      - name: Test Debian Latest
        run: |
          grep ^deb /etc/apt/sources.list  | sed 's/deb http/deb-src http/' >> /etc/apt/sources.list
          apt update
          apt install -y debhelper-compat catkin libroscpp-core-dev ros-message-generation libstd-msgs-dev python3-all python3-setuptools dh-sequence-python3 ros-std-msgs ros-sensor-msgs ros-actionlib-msgs ros-geometry-msgs libstd-msgs-dev libsensor-msgs-dev libactionlib-msgs-dev libgeometry-msgs-dev libcv-bridge-dev libmessage-filters-dev
          export EXIT_STATUS=0; for pkg in *_msgs; do ( mkdir -p $pkg/build; cd $pkg/build; cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..; make VERBOSE=1 ) || export EXIT_STATUS=$?; done; exit $EXIT_STATUS;

  # ROS-O setup https://github.com/v4hn/ros-o-builder/blob/jammy-one/README.md#install-instructions
  ros-o:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - DISTRO: ubuntu:22.04
            ROS_ONE_VARIANT: v4hn
            ROS_REPOSITORY_URL: "deb [trusted=yes] https://raw.githubusercontent.com/v4hn/ros-o-builder/jammy-one/repository ./"
            ROSDEP_PACKAGE_MAPPING: "yaml https://raw.githubusercontent.com/v4hn/ros-o-builder/jammy-one/repository/local.yaml debian"
          - DISTRO: ubuntu:24.04
            ROS_ONE_VARIANT: techfak
            ROS_REPOSITORY_URL: "deb [trusted=yes] https://ros.packages.techfak.net noble main"
            ROSDEP_PACKAGE_MAPPING: "yaml https://ros.packages.techfak.net/ros-one.yaml ubuntu"

    container: ${{ matrix.DISTRO }}

    env:
      DEBIAN_FRONTEND : noninteractive

    steps:
      - name: Chcekout Source
        uses: actions/checkout@v3.0.2

      - name: Setup ROS-O deb repository
        run: |
          set -x
          apt update && apt install -qq -y ca-certificates git
          echo ${{ matrix.ROS_REPOSITORY_URL }} | tee /etc/apt/sources.list.d/ros-o-builder.list
          apt update
          if [[ "${{ matrix.ROS_ONE_VARIANT }}" == "v4hn" ]]; then
              apt install -qq -y python3-rosdep2
          fi
          if [[ "${{ matrix.ROS_ONE_VARIANT }}" == "techfak"  ]]; then
              # Do not install python3-rosdep2, which is an outdated version of rosdep shipped via the Ubuntu repositories (instead of ROS)!
              apt install -qq -y python3-rosdep
              rosdep init
          fi
          echo ${{ matrix.ROSDEP_PACKAGE_MAPPING }} | tee /etc/ros/rosdep/sources.list.d/1-ros-o-builder.list
          rosdep update
        shell: bash

      - name: Setup catkin-tools
        run: |
          set -x
          # setup catkin tools
          apt install -qq -y python3-pip
          if [[ "${{ matrix.ROS_ONE_VARIANT }}" == "v4hn" ]]; then
              pip3 install catkin-tools==0.9.4
              apt install -qq -y catkin
          fi
          if [[ "${{ matrix.ROS_ONE_VARIANT }}" == "techfak" ]]; then
              apt install -qq -y ros-one-catkin python3-catkin-tools
          fi
          # setup build tools
          apt install -qq -y cmake build-essential ros-one-rosbash
        shell: bash

      - name: Setup Workspace
        run: |
          source /opt/ros/one/setup.bash
          set -x
          # setup workspace
          mkdir -p ~/ws/src
          cd ~/ws/src
          if [[ "${{ matrix.ROS_ONE_VARIANT }}" == "techfak" ]]; then
          # TODO: remove these lines and uncomment https://github.com/ubi-agni/ros-builder-action/blob/191fab06004ad5784c28cf2ba2b18f6d163a860d/ros-one.repos#L1089
              git clone https://github.com/locusrobotics/catkin_virtualenv.git
          fi
          ln -sf $GITHUB_WORKSPACE .
          rosdep install -qq -r -y --from-path . --ignore-src || echo "OK"
          # check all system packages are able to install, because ROS-O build deb files that needs all packages
          PIP_BREAK_SYSTEM_PACKAGES=1 rosdep install -qq --simulate -y --from-path . --ignore-src -t exec -t buildtool_export -t buildtool -t build -t build_export | tee rosdep-install.sh
          sed 's/apt-get install/apt-get -y install/;/install ros-one/s/^/#/;/pip3 install/s/^/#/' rosdep-install.sh | bash -xe
        shell: bash

      - name: Compile Packages
        run: |
          source /opt/ros/one/setup.bash
          set -x
          cd ~/ws/
          catkin build --no-status -sv ${{ matrix.CATKIN_OPTIONS }} -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON ${{ matrix.CMAKE_OPTIONS }}
        shell: bash

      - name: Upload rosout/node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roslogs-${{ matrix.DISTRO }}-${{ matrix.ROS_ONE_VARIANT }}
          path: ~/.ros/log
          retention-days: 5
